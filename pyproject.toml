[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-booking-receptionist"
version = "0.1.0"
description = "A Claude tool-use agent that books appointment slots — sanitized extract of a production WhatsApp AI receptionist."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Juan Francisco Páez" }]
keywords = ["claude", "anthropic", "tool-use", "agent", "llm", "prompt-injection", "booking"]

dependencies = [
    # Official Anthropic Python SDK. Only needed for the LIVE path; --dry-run
    # runs with no dependencies at all.
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Everything CI needs. Pinned only by lower bound: the checks must keep passing
# as the tools move, and a frozen lockfile would hide that.
dev = ["pytest>=7", "mypy>=1.8", "ruff>=0.5"]

[project.scripts]
booking-receptionist = "booking_receptionist.__main__:main"
# Console entry point for the deterministic eval runner. Same code as
# `python evals/run.py`; exit 0 = all cases pass, 1 = at least one failed.
booking-evals = "booking_receptionist.evals_runner:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Tooling. All three run in CI (.github/workflows/ci.yml) with no secrets and
# no network access from the application code — the eval runner and the whole
# test suite go through the deterministic stub client.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets `pytest` work straight from a clone, before `pip install -e .`.
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "evals"]
warn_unreachable = true
pretty = false

[[tool.mypy.overrides]]
# The Anthropic SDK is only needed for the LIVE path; keep type checking green
# in an environment that has not installed it.
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
# Deliberately wider than ruff's default (E4/E7/E9 + F): import order (I),
# likely bugs (B), comprehension smells (C4), modern syntax (UP), simplifiable
# code (SIM) and ruff's own checks (RUF, which also flags stale `noqa`).
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RUF"]
