name: CI

# Runs on every push and pull request. No repository secrets are referenced and
# no credential is needed: the whole suite, the eval runner and the dry run all
# go through the deterministic stub model client, so nothing here calls a paid
# API or reaches the network from the application code.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ruff + mypy + pytest + evals (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and the dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check

      - name: Type check (mypy --strict)
        run: python -m mypy --strict

      - name: Tests (pytest)
        run: python -m pytest

      - name: Evals (7 deterministic cases, stub model)
        run: python evals/run.py

      - name: Dry run (the full agentic loop, no API key)
        run: python -m booking_receptionist --dry-run
